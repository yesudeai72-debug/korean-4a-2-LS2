<title>듣기 2 - 놀이공원 대화 연습</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#F6F3ED;
    --surface:#FFFFFF;
    --surface-2:#EFE8DB;
    --staff-bubble:#E4F0EE;
    --staff-bubble-border:#BFDAD6;
    --patient-bubble:#FBF1E4;
    --patient-bubble-border:#E9D8B8;
    --ink:#22242A;
    --ink-soft:#5C5F67;
    --ink-faint:#8B8E95;
    --accent:#1F6F72;
    --accent-strong:#134548;
    --accent-soft:#DCEDEC;
    --line:#DFD8C8;
    --correct:#2E7D4F;
    --correct-bg:#E4F3E9;
    --incorrect:#B94A34;
    --incorrect-bg:#FBEAE6;
    --shadow: 0 1px 2px rgba(34,36,42,0.04), 0 8px 24px -12px rgba(34,36,42,0.18);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181A1D;
      --surface:#212327;
      --surface-2:#2A2C31;
      --staff-bubble:#1D3230;
      --staff-bubble-border:#2E4E4A;
      --patient-bubble:#302A20;
      --patient-bubble-border:#4A4130;
      --ink:#EDEBE5;
      --ink-soft:#B3B0A8;
      --ink-faint:#83807A;
      --accent:#5FBDB8;
      --accent-strong:#8ED8D3;
      --accent-soft:#22403E;
      --line:#3A3C41;
      --correct:#79D69B;
      --correct-bg:#1E3227;
      --incorrect:#F0917E;
      --incorrect-bg:#3A241F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181A1D;
    --surface:#212327;
    --surface-2:#2A2C31;
    --staff-bubble:#1D3230;
    --staff-bubble-border:#2E4E4A;
    --patient-bubble:#302A20;
    --patient-bubble-border:#4A4130;
    --ink:#EDEBE5;
    --ink-soft:#B3B0A8;
    --ink-faint:#83807A;
    --accent:#5FBDB8;
    --accent-strong:#8ED8D3;
    --accent-soft:#22403E;
    --line:#3A3C41;
    --correct:#79D69B;
    --correct-bg:#1E3227;
    --incorrect:#F0917E;
    --incorrect-bg:#3A241F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', system-ui, sans-serif;
    padding:32px 16px 64px;
    display:flex;
    justify-content:center;
  }
  .page{
    width:100%;
    max-width:680px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  /* ---- header / console bar ---- */
  .console{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:20px 24px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .console-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--accent);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  h1{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    font-size:26px;
    line-height:1.3;
    margin:0;
    text-wrap:balance;
  }
  .instructions{
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-soft);
  }
  .instructions b{color:var(--ink);font-weight:600;}

  /* ---- audio player ---- */
  .player{
    display:flex;
    flex-direction:column;
    gap:10px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:16px 0;
  }
  .player-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .play-toggle{
    flex:0 0 auto;
    width:46px;height:46px;
    border-radius:50%;
    padding:0;
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .play-toggle:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .seek{
    flex:1 1 auto;
    -webkit-appearance:none;
    appearance:none;
    height:6px;
    border-radius:999px;
    background:var(--surface-2);
    outline:none;
    cursor:pointer;
  }
  .seek::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);
    border:2px solid var(--surface);
    box-shadow:0 0 0 1px var(--accent);
    cursor:pointer;
  }
  .seek::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:var(--accent);
    border:2px solid var(--surface);
    cursor:pointer;
  }
  .time{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .player-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .player-controls button{
    padding:7px 13px;
    font-size:13px;
  }
  .speed-select{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:600;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:7px 10px;
    cursor:pointer;
  }

  /* ---- controls ---- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  button{
    font-family:'Noto Sans KR', sans-serif;
    font-size:14px;
    font-weight:600;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:10px 18px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  button:hover{border-color:var(--accent);}
  button:active{transform:scale(0.97);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button.ghost{background:transparent;}
  button:disabled{opacity:0.45;cursor:not-allowed;}

  .score{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:700;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
    font-variant-numeric:tabular-nums;
  }
  .score .num{color:var(--accent-strong);}

  /* ---- transcript ---- */
  .transcript{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .line{
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  .line.staff{flex-direction:row;}
  .line.patient{flex-direction:row-reverse;}

  .bubble-wrap{
    display:flex;
    flex-direction:column;
    gap:4px;
    max-width:88%;
  }
  .line.staff .bubble-wrap{align-items:flex-start;}
  .line.patient .bubble-wrap{align-items:flex-end;}

  .speaker-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--ink-faint);
    padding:0 4px;
  }

  .bubble{
    border-radius:16px;
    padding:13px 16px;
    font-size:15.5px;
    line-height:1.7;
    box-shadow:var(--shadow);
    border:1px solid transparent;
  }
  .line.staff .bubble{
    background:var(--staff-bubble);
    border-color:var(--staff-bubble-border);
    border-bottom-left-radius:4px;
  }
  .line.patient .bubble{
    background:var(--patient-bubble);
    border-color:var(--patient-bubble-border);
    border-bottom-right-radius:4px;
  }

  /* blanks: plain vocabulary */
  .blank-input{
    font-family:'Noto Sans KR', sans-serif;
    font-size:15.5px;
    font-weight:600;
    text-align:center;
    border:none;
    border-bottom:2px solid var(--accent);
    background:var(--surface);
    color:var(--ink);
    border-radius:6px 6px 2px 2px;
    padding:2px 6px;
    width:5.5ch;
    outline:none;
  }
  .blank-input.wide{width:8ch;}
  .blank-input:focus{background:var(--accent-soft);}
  .blank-input.correct{border-bottom-color:var(--correct);background:var(--correct-bg);color:var(--correct);}
  .blank-input.incorrect{border-bottom-color:var(--incorrect);background:var(--incorrect-bg);color:var(--incorrect);}
  .blank-input.revealed{border-bottom-style:dashed;}

  /* click-to-conjugate blanks */
  .click-blank{
    font-family:'JetBrains Mono','Noto Sans KR',monospace;
    font-size:13.5px;
    font-weight:600;
    color:var(--accent-strong);
    background:var(--accent-soft);
    border:1px dashed var(--accent);
    border-radius:6px;
    padding:2px 8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .click-blank:hover{background:var(--accent);color:#fff;}
  .click-blank.incorrect{
    border-color:var(--incorrect);
    background:var(--incorrect-bg);
    color:var(--incorrect);
  }
  .conj-slot{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap;}
  .conj-slot .base-tag{
    font-size:11.5px;
    color:var(--ink-faint);
    font-family:'JetBrains Mono', monospace;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--ink-faint);
    padding-top:8px;
  }

  @media (max-width:480px){
    .bubble-wrap{max-width:92%;}
    h1{font-size:22px;}
    .console{padding:16px 18px;}
  }
</style>

<div class="page">
  <div class="console">
    <div class="console-top">
      <div class="eyebrow"><span class="dot"></span>듣기 2 · TRACK 19 · P.56</div>
    </div>
    <h1>야, 오랜만에 놀이공원에 오니까 좋다.</h1>
    <div class="instructions">
      음원을 들으며 빈칸에 들리는 단어를 쓰세요. <b>점선 테두리 단어</b>(기본형)는 클릭하면 입력창으로 바뀌니, 문맥에 맞는 <b>종결/활용 어미 형태</b>로 고쳐 써 보세요. 잘 안 들리면 배속을 0.6x~0.9x로 낮추거나 5초 되감기를 눌러 반복해서 들어 보세요.
    </div>

    <audio id="audio" src="track19.mp3" preload="metadata"></audio>
    <div class="player">
      <div class="player-row">
        <button class="play-toggle" id="playToggle" aria-label="재생">▶</button>
        <input type="range" class="seek" id="seek" value="0" min="0" max="100" step="0.1">
        <div class="time" id="timeLabel">00:00 / 00:00</div>
      </div>
      <div class="player-controls">
        <button class="ghost" id="back5">⏪ 5초</button>
        <button class="ghost" id="fwd5">5초 ⏩</button>
        <select class="speed-select" id="speed">
          <option value="0.6">0.6x</option>
          <option value="0.7">0.7x</option>
          <option value="0.8" selected>0.8x</option>
          <option value="0.9">0.9x</option>
          <option value="1">1.0x</option>
        </select>
      </div>
    </div>

    <div class="controls">
      <button id="checkAll">✔ 정답 확인</button>
      <button id="revealAll">👁 정답 보기</button>
      <button class="ghost" id="resetAll">↺ 다시 하기</button>
      <div class="score">맞은 개수 <span class="num" id="scoreNum">0</span>/<span id="scoreTotal">7</span></div>
    </div>
  </div>

  <div class="transcript" id="transcript"></div>

  <footer>놀이공원 대화 · 듣기 2 · Track 19 · P.56</footer>
</div>

<script>
(function(){
  const lines = [
    {
      speaker:'남',
      parts:[
        {t:'text', v:'야, 오랜만에 '},
        {t:'blank', id:'bNoliGongwon', answer:'놀이공원'},
        {t:'text', v:'에 '},
        {t:'conj', id:'bOda', base:'오다', answer:'오니까'},
        {t:'text', v:' 좋다.'}
      ]
    },
    {
      speaker:'여',
      parts:[
        {t:'text', v:'그러게. 그동안 '},
        {t:'blank', id:'bStress1', answer:'스트레스'},
        {t:'text', v:' 때문에 가슴이 '},
        {t:'conj', id:'bDapdap', base:'답답하다', answer:'답답했는데'},
        {t:'text', v:' 오늘 하루 신나게 놀고 나면 다 '},
        {t:'conj', id:'bPullida', base:'풀리다', answer:'풀리겠지'},
        {t:'text', v:'? 우리 뭐부터 탈까?'}
      ]
    },
    {
      speaker:'남',
      parts:[
        {t:'text', v:'당연히 '},
        {t:'blank', id:'bRoller1', answer:'롤러코스터', width:'wide'},
        {t:'text', v:'부터 '},
        {t:'conj', id:'bTada1', base:'타다', answer:'타야지'},
        {t:'text', v:'.'}
      ]
    },
    {
      speaker:'여',
      parts:[
        {t:'text', v:'뭐? 롤러코스터를 타자고? 난 그런 건 딱 '},
        {t:'blank', id:'bJilsaek', answer:'질색'},
        {t:'text', v:'이야.'}
      ]
    },
    {
      speaker:'남',
      parts:[
        {t:'text', v:'왜? 하늘 높이 올라갔다가 아래로 뚝 '},
        {t:'conj', id:'bTteoreojida', base:'떨어지다', answer:'떨어질'},
        {t:'text', v:' 때 얼마나 신나는데.'}
      ]
    },
    {
      speaker:'여',
      parts:[
        {t:'text', v:'난 무서워서 싫은데. 높은 데만 올라가면 너무 '},
        {t:'blank', id:'bGinjang', answer:'긴장'},
        {t:'text', v:'이 되거든. '},
        {t:'blank', id:'bJinanbeon', answer:'지난번', width:'wide'},
        {t:'text', v:'에 한 번 타 봤는데 어찌나 무서운지 숨도 못 쉴 정도였어.'}
      ]
    },
    {
      speaker:'남',
      parts:[
        {t:'text', v:'알았어. 그럼 넌 뭐 '},
        {t:'conj', id:'bTada2', base:'타다', answer:'타고'},
        {t:'text', v:' 싶은데?'}
      ]
    },
    {
      speaker:'여',
      parts:[
        {t:'text', v:'얼마 전에 '},
        {t:'blank', id:'bGwango', answer:'광고'},
        {t:'text', v:'에서 봤는데 진짜 재미있는 '},
        {t:'blank', id:'bNoliGigu1', answer:'놀이 기구', width:'wide'},
        {t:'text', v:'가 생겼대.'}
      ]
    },
    {
      speaker:'남',
      parts:[{t:'text', v:'그래? 어떤 건데?'}]
    },
    {
      speaker:'여',
      parts:[
        {t:'text', v:'음악에 맞춰 의자가 계속 빙글빙글 '},
        {t:'conj', id:'bDolda', base:'돌다', answer:'도는'},
        {t:'text', v:' 놀이 기구래. 진짜 재미있겠지?'}
      ]
    },
    {
      speaker:'남',
      parts:[
        {t:'text', v:'어휴, 난 돌아가는 건 별론데. 그런 건 탈 때마다 '},
        {t:'blank', id:'bMeolmi', answer:'멀미'},
        {t:'text', v:'가 나서 '},
        {t:'conj', id:'bEojireopda', base:'어지럽다', answer:'어지럽고'},
        {t:'text', v:' 속이 거북해진단 말이야. 오히려 더 스트레스를 받을 것 같은데.'}
      ]
    }
  ];

  const TOTAL_BLANKS = 17;
  document.getElementById('scoreTotal').textContent = TOTAL_BLANKS;

  const transcriptEl = document.getElementById('transcript');

  function buildConjChip(p, slot){
    const chip = document.createElement('span');
    chip.className = 'click-blank';
    chip.textContent = p.base;
    chip.dataset.converted = 'false';
    chip.tabIndex = 0;
    chip.setAttribute('role','button');
    chip.title = '클릭해서 알맞은 형태로 써 보세요';
    function convert(){
      if (chip.dataset.converted === 'true') return;
      chip.dataset.converted = 'true';
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'blank-input wide';
      inp.id = p.id;
      inp.dataset.answer = p.answer;
      inp.autocomplete = 'off';
      inp.setAttribute('aria-label', p.base + ' 활용형');
      const tag = document.createElement('span');
      tag.className = 'base-tag';
      tag.textContent = '(' + p.base + ')';
      slot.innerHTML = '';
      slot.appendChild(inp);
      slot.appendChild(tag);
      inp.focus();
    }
    chip.addEventListener('click', convert);
    chip.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); convert(); }
    });
    slot.appendChild(chip);
  }

  lines.forEach((line, idx) => {
    const roleClass = line.speaker === '남' ? 'staff' : 'patient';
    const row = document.createElement('div');
    row.className = 'line ' + roleClass;
    row.dataset.lineIndex = idx;

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    const label = document.createElement('div');
    label.className = 'speaker-label';
    label.textContent = line.speaker === '남' ? '남' : '여';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    line.parts.forEach(p => {
      if (p.t === 'text'){
        bubble.appendChild(document.createTextNode(p.v));
      } else if (p.t === 'blank'){
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'blank-input' + (p.width === 'wide' ? ' wide' : '');
        inp.id = p.id;
        inp.dataset.answer = p.answer;
        inp.autocomplete = 'off';
        inp.setAttribute('aria-label', '빈칸');
        bubble.appendChild(inp);
      } else if (p.t === 'conj'){
        const slot = document.createElement('span');
        slot.className = 'conj-slot';
        slot.id = p.id + '-slot';
        buildConjChip(p, slot);
        bubble.appendChild(slot);
      }
    });

    wrap.appendChild(label);
    wrap.appendChild(bubble);
    row.appendChild(wrap);
    transcriptEl.appendChild(row);
  });

  /* ---------------- audio player ---------------- */
  const audio = document.getElementById('audio');
  const playToggle = document.getElementById('playToggle');
  const seek = document.getElementById('seek');
  const timeLabel = document.getElementById('timeLabel');
  const speedSelect = document.getElementById('speed');
  let seeking = false;

  function fmt(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  audio.addEventListener('loadedmetadata', () => {
    seek.max = audio.duration;
    timeLabel.textContent = fmt(0) + ' / ' + fmt(audio.duration);
    audio.playbackRate = parseFloat(speedSelect.value);
  });
  audio.addEventListener('timeupdate', () => {
    if (!seeking){
      seek.value = audio.currentTime;
    }
    timeLabel.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
  });
  audio.addEventListener('play', () => { playToggle.textContent = '⏸'; playToggle.setAttribute('aria-label','일시정지'); });
  audio.addEventListener('pause', () => { playToggle.textContent = '▶'; playToggle.setAttribute('aria-label','재생'); });
  audio.addEventListener('ended', () => { playToggle.textContent = '▶'; });

  playToggle.addEventListener('click', () => {
    if (audio.paused) audio.play(); else audio.pause();
  });
  seek.addEventListener('input', () => {
    seeking = true;
    timeLabel.textContent = fmt(seek.value) + ' / ' + fmt(audio.duration);
  });
  seek.addEventListener('change', () => {
    audio.currentTime = parseFloat(seek.value);
    seeking = false;
  });
  document.getElementById('back5').addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
  });
  document.getElementById('fwd5').addEventListener('click', () => {
    audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 5);
  });
  speedSelect.addEventListener('change', () => {
    audio.playbackRate = parseFloat(speedSelect.value);
  });
  audio.playbackRate = parseFloat(speedSelect.value);

  /* ---------------- checking / reveal / reset ---------------- */
  function allAnswerEls(){
    return Array.from(document.querySelectorAll('.blank-input'));
  }
  function unconvertedChips(){
    return Array.from(document.querySelectorAll('.click-blank[data-converted="false"]'));
  }
  function updateScore(correct){
    document.getElementById('scoreNum').textContent = correct;
  }

  document.getElementById('checkAll').addEventListener('click', () => {
    let correct = 0;
    allAnswerEls().forEach(inp => {
      const ans = inp.dataset.answer;
      const val = inp.value.trim();
      inp.classList.remove('correct','incorrect','revealed');
      if (val === ans){ inp.classList.add('correct'); correct++; }
      else { inp.classList.add('incorrect'); }
    });
    unconvertedChips().forEach(chip => chip.classList.add('incorrect'));
    updateScore(correct);
  });

  document.getElementById('revealAll').addEventListener('click', () => {
    document.querySelectorAll('.click-blank[data-converted="false"]').forEach(chip => chip.click());
    setTimeout(() => {
      let correct = 0;
      allAnswerEls().forEach(inp => {
        inp.value = inp.dataset.answer;
        inp.classList.remove('incorrect');
        inp.classList.add('correct','revealed');
        correct++;
      });
      updateScore(correct);
    }, 0);
  });

  document.getElementById('resetAll').addEventListener('click', () => {
    allAnswerEls().forEach(inp => {
      inp.value = '';
      inp.classList.remove('correct','incorrect','revealed');
    });
    document.querySelectorAll('.conj-slot').forEach(slot => { slot.innerHTML = ''; });
    lines.forEach(line => {
      line.parts.forEach(p => {
        if (p.t === 'conj'){
          const slot = document.getElementById(p.id + '-slot');
          if (slot) buildConjChip(p, slot);
        }
      });
    });
    updateScore(0);
  });
})();
</script>
